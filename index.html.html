{t:'Los lunes',i:'clock',v:'Dibujo de un despertador: “Mi cara cuando recuerdo que mañana es lunes”',s:'Una cuenta publica un dibujo de un despertador con el texto: “Mi cara cuando recuerdo que mañana es lunes”. No aparece ni se identifica a ninguna persona.',q:'¿De qué se está haciendo humor?',g:0,e:['El humor se centra en una situación cotidiana compartida. No se señala ni se ridiculiza a una persona.','Es una opción prudente, pero ¿qué dato concreto falta? Si algo te preocupa, nómbralo sin inventar información que el caso no cuenta.','¿Qué elemento concreto de la publicación haría daño? No aparece ni se identifica a nadie. Justifica tu lectura sin añadir datos que no están.']},
{t:'El montaje',i:'image',v:'Montaje sobre el aspecto físico',s:'Una cuenta publica un montaje de un profesor exagerando su aspecto físico y añade un mote para que otras personas se rían de él.',q:'¿La gracia está en una situación o en ridiculizar a alguien?',g:2,e:['Fíjate en de quién se ríe la gente: el chiste solo funciona burlándose de una persona concreta. Hablemos de eso.','Aquí no falta información: ya sabemos que se usa el aspecto de una persona y un mote para que otros se rían de ella.','La publicación utiliza el aspecto de una persona para convertirla en objeto de burla. Ser profesor o profesora no hace que una humillación deje de importar. Esto no se decide por mayoría de votos.']},

{t:'“Seguro que no le importa”',i:'image',v:'Foto de un amigo (no mostrada)',s:'Quieres subir una foto graciosa de un amigo. No le has preguntado y piensas: “Seguro que no le importa”.',q:'¿Qué necesitas saber antes de publicarla?',g:1,e:['Puede que sea una foto simpática, pero partes de una suposición: aún no sabes qué piensa tu amigo.','Falta conocer qué piensa la persona que aparece. Suponer que está de acuerdo no equivale a preguntarle. Antes de publicar, habla con ella; si no quiere, respeta su decisión.','No hay datos para afirmar que le hará daño: una foto graciosa no humilla por sí misma. Precisamente por eso falta preguntarle.']},

{t:'“No sabes aguantar una broma”',i:'ear',v:'Meme retirado de la vista. Contenido no mostrado',s:'La persona que aparece en un meme pide que lo retiren porque se siente humillada. Le responden: “No sabes aguantar una broma”.',q:'¿Qué deberíamos hacer cuando alguien expresa que algo le está haciendo daño?',g:2,e:['Cuando la persona dice que se siente humillada, “era una broma” no cancela el efecto.','Ya tenemos lo esencial: la persona expresa claramente su malestar y pide que lo retiren.','Escuchar, dejar de difundir y atender la petición de retirada es una forma de respetar a la persona. Decir que era una broma no borra sus efectos.']}];

,'Repasa las tres ideas y la frase final. Nada de puntuaciones ni premios.','Revela los mensajes uno a uno. Explora todas las opciones: pedir ayuda en privado es una forma válida de actuar. Cierra con el cambio de enfoque: no hace falta enfrentarse al grupo.','Reconoce la presión del grupo sin culpabilizar. El mini reto admite tres respuestas completas.','Se ofrece acompañamiento y se respeta la decisión de la persona afectada.','No se inventan protocolos del centro. Si se habla de guardar información, que sea con ayuda adulta y sin reenviar. '+CONS,'Pide debate en pequeños grupos y elegir exactamente tres compromisos.','Proyecta el acuerdo. No se piden firmas ni nombres.','Respuesta individual en papel, sin nombre. No se recoge nada en esta pantalla.','Respuesta individual en papel, sin nombre.','Respuesta individual en papel, sin nombre.','Recuerda las vías de ayuda del centro. '+CONS];

const ALARM='<svg width="130" height="130" viewBox="0 0 100 100" aria-hidden="true"><circle cx="22" cy="20" r="9" fill="#7661C5"/><circle cx="78" cy="20" r="9" fill="#7661C5"/><path d="M30 90l-6 8M70 90l6 8" stroke="#24324B" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="54" r="36" fill="#fff" stroke="#24324B" stroke-width="5"/><path d="M50 54V34M50 54l14 8" stroke="#24324B" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="54" r="3" fill="#24324B"/></svg>';
const w=(i,t,s)=>`<div class="wh">${av(i)}${s?`<small class="g">${s}</small>`:''}${t?`<div class="bub">${t}</div>`:''}</div>`;
const SCN=[0,`<div class="sc">${w(2,'','Profesor (personaje ficticio)')}${w(0,'ja ja ja','Alumno')}${w(1,'ja ja','Alumna')}</div>`,`<div class="sc">${w(3,'… me he equivocado','Compañera leyendo')}${ic('play',48)}${w(0,'ja ja ja','Quien graba')}${w(1,'ja ja','Público')}</div>`,`<div class="sc">${w(0,'Seguro que no le importa','Tú, con el móvil')}${w(1,'','Tu amigo (aún no sabe nada)')}</div>`,`<div class="sc">${w(1,'','Compañero en la publicación')}${w(0,'😂😂','Otras personas')}${w(2,'😂😂','Tú, con una reacción')}</div>`,`<div class="sc">${w(3,'Por favor, retíralo. Me siento mal.','Persona del meme')}${w(0,'No sabes aguantar una broma','Quien lo publicó')}</div>`];
const pc=(c,n)=>`<div class="pc"><div class="ph"><svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#C9CFE0"/><circle cx="24" cy="19" r="8" fill="#fff"/><path d="M8 46c1-9 8-13 16-13s15 4 16 13z" fill="#fff"/></svg><div><b>Cuenta ficticia</b><small>Publicación simulada</small></div></div><div class="pbd ${n?'':'ok'}">${n==0?`<div>${ALARM}<p><b>${c.v}</b></p></div>`:`<div>${SCN[n]}<p class="cap">${c.v} · Contenido no mostrado</p></div>`}</div><div class="pr">${ic('heart',24)}${ic('msg',24)}${ic('share',24)}</div></div>`;
const cas=n=>{const c=CASES[n],s=S.r['k'+n];return`<span class="tag">Caso ${n+1} de 6 · ${c.t}</span><div class="two"><div>${pc(c,n)}<p class="big">${c.s}</p></div><div>${opts('k'+n,OP,s)}${s!=null?`<div class="fb"><b>${c.q}</b> <p>${T('x'+n)?'':`<button class="pri" data-a="set" data-k="x${n}" data-v="1">Ver explicación</button>`}</p></div>`:''}${s!=null&&T('x'+n)?fb('x'+n,c.e[s]+`<p class="g">Lectura más ajustada con la información del caso: ${OP[c.g][1]}.</p>`,'ex'):''}</div></div>`};
const SC=[
()=>`<div class="two"><div><span class="tag">Tutoría · 2.º ESO</span><h1>Detrás de la pantalla hay una persona</h1><p class="sub">Humor, respeto y decisiones en las redes</p><p class="big" style="margin-top:1em"><b>¿Todo lo que hace reír es una broma?</b></p>${nb('Empezamos',1)}</div><div class="cv"><i></i><i></i><i></i><div class="cover">${[0,1,2,3].map(av).join('')}</div></div></div>`,
()=>`<h2>Nuestro punto de partida</h2><p class="big">Hoy no vamos a buscar culpables ni a hablar de casos concretos. Vamos a pensar cómo conseguir que todas las personas se sientan respetadas, también en las redes.</p><div class="row"><div class="card c1">${ic('msg')}<p>Hablamos de situaciones ficticias.</p></div><div class="card c2">${ic('lock')}<p>No mencionamos nombres ni cuentas reales.</p></div><div class="card c3">${ic('people')}<p>Podemos participar sin contar experiencias personales.</p></div></div><p class="sub">Si algo de lo que hablamos te preocupa, puedes comentarlo en privado con una persona adulta de confianza.</p>`,
()=>`<h2>¿Qué son las cuentas «curis»?</h2><p>En esta tutoría usamos este nombre para referirnos a cuentas de redes sociales que publican memes, montajes o comentarios sobre personas de un centro educativo, a veces desde el anonimato.</p><p class="sub">Para valorar una publicación, debemos mirar qué muestra, cómo trata a las personas y qué efectos puede tener.</p><div class="row">${tg('t1','El contenido','<span>¿Habla de una situación cotidiana o ridiculiza a una persona?</span>','c1')}${tg('t2','La persona','<span>¿Se ha contado con ella? ¿Se siente expuesta, avergonzada o humillada?</span>','c2')}${tg('t3','La difusión','<span>¿Qué ocurre cuando se comparte, se comenta o recibe reacciones de burla?</span>','c3')}</div>`,
()=>{const n=S.r.sq||0,L=['Alguien publica','Otras personas reaccionan','Se comparte','Llega a más gente'];return`<h2>Una publicación no se queda en una pantalla</h2><div class="steps">${L.map((l,j)=>`<div class="st ${j<n?'':'e'}">${j<n?(j?'→ ':'')+l:'· · ·'}</div>`).join('')}</div>${n<4?`<button class="pri" data-a="inc" data-k="sq">Ver siguiente paso</button>`:`<div class="fb ex" role="status"><b>Aunque no hayas creado una publicación, tus decisiones pueden aumentar su difusión o ayudar a frenar el daño.</b></div>${nb('Vamos a decidir',4)}`}`},
...CASES.map((c,i)=>()=>cas(i)),
()=>`<h2>Lo que nos llevamos</h2><div class="row">${tg('z1','','<span>La intención cuenta, y el efecto también.</span>','c1')}${tg('z2','','<span>Compartir y reaccionar puede aumentar el daño.</span>','c2')}${tg('z3','','<span>Si alguien expresa malestar, hay que escuchar.</span>','c3')}</div><p class="sub">Podemos reírnos juntos sin convertir a alguien en el blanco de la risa.</p>${nb('Pasamos al chat',11)}`,
()=>{const n=S.r.n1||0,s=S.r.c1,all=C1.every((_,j)=>S.r['c1v'+j]);return`<span class="tag">Escena 1 · Llega la publicación</span><p class="hint">Conversación ficticia. Vamos a decidir qué podríamos hacer.</p><div class="two"><div><div class="chat" id="chat">${msgs(M1,n)||'<p class="hint">Pulsa el botón para empezar.</p>'}</div>${n<6?`<p><button class="pri" data-a="inc" data-k="n1">Mostrar siguiente mensaje</button></p>`:''}</div><div>${n>=6?`<h2>Estás en este grupo. ¿Qué podrías hacer?</h2>${opts('c1',C1,s)}${s!=null?fb('c1',C1[s][2]):''}${all?'<div class="fb ex"><b>Hay distintas maneras de ayudar. Lo importante es no aumentar la difusión y buscar una forma segura de actuar.</b></div>':''}`:''}</div></div>`},
()=>{const s=S.r.c2,m=T('m2'),a=s!=null;return`<span class="tag">Escena 2 · La presión del grupo</span><div class="two"><div><div class="chat"><div class="m">${av(1)}<div><small>Dani · mensaje privado</small><div class="bub">“No se lo digas a nadie, que nos metes en un lío”</div></div></div></div></div><div>${m?`<h2>Mini reto: marca un límite y propón una acción</h2>${opts('f2',FR.map(f=>['msg',f]),S.r.f2)}${S.r.f2!=null?`<div class="m">${av(3)}<div class="bub" style="font-weight:700">${FR[S.r.f2]}</div></div>`:''}<button class="btn" data-a="tog" data-k="m2">← Volver a las opciones</button>`:`<h2>¿Cómo podrías responder?</h2>${opts('c2',C2,s)}${a?fb('c2',C2[s][2]):''}${a?'<button class="pri" data-a="tog" data-k="m2">Mini reto</button>':''}`}</div></div>`},
()=>{const sel=S.r.s3||[],d=T('s3d');return`<span class="tag">Escena 3 · Apoyar a la persona</span><p class="big">La persona afectada se entera de la publicación y está pasándolo mal. <b>Elige dos formas de apoyo.</b></p><div class="two"><div>${S3.map((o,j)=>`<button class="opt ${sel.includes(j)?'on':''}" data-a="s3" data-v="${j}" aria-pressed="${sel.includes(j)}">${ic(['ear','stop','heart','people'][j])}<span>${o[0]}${d?`<br><small class="g">${o[1]}</small>`:''}</span></button>`).join('')}<p class="hint">Seleccionadas: ${sel.length} de 2</p></div><div>${d?`<div class="fb ex"><b>Escuchar y ofrecer compañía ayuda a que la persona no se sienta sola. No hace falta que se exponga públicamente ni que demuestre su malestar delante del grupo.</b><p>El acompañamiento se ofrece, y se respeta la decisión de la persona.</p></div>`:`<button class="pri" data-a="set" data-k="s3d" data-v="1" ${sel.length==2?'':'disabled'}>Comentar decisiones</button>`}</div></div>`},
()=>`<span class="tag">Escena 4</span><h2>¿A quién podemos acudir?</h2><div class="row">${WHO.map((w,j)=>tg('w'+j,w[0],`<span>${w[1]}</span>`,'c'+(j%5+1))).join('')}</div><p class="sub">Pedir ayuda permite que otras personas intervengan y nos acompañen. No necesitas investigar quién está detrás ni resolverlo por tu cuenta.</p><p class="hint">Si hace falta guardar información para explicar lo ocurrido, hazlo con ayuda adulta, por un canal privado y sin reenviarla.</p>`,
()=>{const a=S.r.ag||[];return`<h2>¿Qué queremos que pase en nuestro grupo?</h2><p>Debatid y elegid tres compromisos que podamos cumplir. <b>Elegidos: ${a.length} de 3</b></p><div class="row">${AGR.map((t,j)=>`<button class="opt ${a.includes(j)?'on':''}" data-a="ag" data-v="${j}" aria-pressed="${a.includes(j)}" style="margin:0">${a.includes(j)?ic('check'):`<i class="bd">${j+1}</i>`}<span>${t}</span></button>`).join('')}</div>${T('agm')?'<div class="fb" role="status">Para añadir este compromiso, cambia uno de los seleccionados.</div>':''}<button class="pri" data-a="go" data-v="16" ${a.length==3?'':'disabled'}>Crear nuestro acuerdo</button>`},
()=>{const a=S.r.ag||[],tx='Nuestro acuerdo de clase\n'+a.map((j,k)=>(k+1)+'. '+AGR[j]).join('\n')+'\nEl respeto también se construye con lo que publicamos, compartimos y decidimos hacer.';return`<h2>Nuestro acuerdo de clase</h2>${a.map(j=>`<div class="big-i">${ic('check',36)}${AGR[j]}</div>`).join('')||'<p>Aún no hay compromisos elegidos.</p>'}<p class="sub">El respeto también se construye con lo que publicamos, compartimos y decidimos hacer.</p><button class="btn" data-a="go" data-v="15">Modificar acuerdo</button> <button class="pri" data-a="copy">Copiar acuerdo</button>${S.r.cp=='ok'?'<p role="status">Acuerdo copiado.</p>':''}${S.r.cp=='x'?`<p role="status">No se ha podido copiar automáticamente. Selecciona el texto y pulsa Ctrl+C (⌘+C en Mac).</p><textarea rows="6" readonly onfocus="this.select()">${tx}</textarea>`:''}`},
...QS.map((q,i)=>()=>`<span class="tag">Me llevo una idea · ${i+1} de 3</span><h2>${q}</h2><p class="big">Responde individualmente, en un papel o aquí. No hace falta poner tu nombre.</p><textarea class="paper" rows="4" data-q="${i}" aria-label="Tu respuesta">${(S.r['q'+i]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea><p class="cap">Puedes escribir aquí o en papel. Lo escrito no se guarda ni se envía: solo se queda en esta pantalla durante la sesión.</p>`),
()=>`<h1>Detrás de cada perfil, foto o vídeo hay una persona.</h1><div class="row"><div class="card c1">${ic('share')}<p>No aumentar la difusión.</p></div><div class="card c2">${ic('heart')}<p>Apoyar a quien lo está pasando mal.</p></div><div class="card c3">${ic('lock')}<p>Pedir ayuda.</p></div></div><p class="sub">Puedes hablar en privado con tu tutor o tutora, con Orientación, con otro docente o con tu familia.</p>${nb('Ver nuestro acuerdo',16)} <button class="btn" data-a="go" data-v="0">Volver al inicio</button>`];
const N=SC.length;
function view(){const m=document.getElementById('main');m.innerHTML=`<div class="scr">${SC[S.i]()}</div>`;const sc=ST.filter(x=>x<=S.i).length-1;document.getElementById('sec').textContent=`Sección ${sc+1} de 6 · ${SECN[sc]}`;document.getElementById('pb').style.width=(S.i+1)/N*100+'%';document.getElementById('cnt').textContent=`${S.i+1} / ${N}`;document.getElementById('pv').disabled=S.i==0;document.getElementById('nx').disabled=S.i==N-1;const as=document.getElementById('as');as.hidden=!notes;document.getElementById('nb').setAttribute('aria-pressed',notes);as.innerHTML=`<h3>Esta pantalla</h3><p>${NT[S.i]}</p><h3>Orientaciones generales</h3><ul>${GEN.map(g=>'<li>'+g+'</li>').join('')}</ul><h3>Si preguntan por consecuencias</h3><p>${CONS}</p>`;document.body.classList.toggle('wide',!!wide);document.getElementById('ov').innerHTML=M?`<div class="ov" role="dialog" aria-modal="true"><div class="card"><h2>¿Reiniciar la sesión?</h2><p>Se borrarán las elecciones realizadas.</p><button class="pri" data-a="rok">Sí, reiniciar</button> <button class="btn" data-a="rno">Cancelar</button></div></div>`:'';document.getElementById('ml').innerHTML=''}
function go(i,keep){S.i=Math.max(0,Math.min(N-1,i));view();if(!keep)document.getElementById('main').scrollTop=0}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,v=+b.dataset.v,r=S.r;let keep=1;
if(a=='prev')return go(S.i-1);if(a=='next')return go(S.i+1);if(a=='go')return go(v);
if(a=='tog')r[k]=!r[k];else if(a=='inc')r[k]=(r[k]||0)+1;else if(a=='clr')r[k]=null;
else if(a=='set'){r[k]=v;if(/^k\d$/.test(k)){r['x'+k.slice(1)]=0}r[k+'v'+v]=1}
else if(a=='s3'){let s=r.s3||[];s=s.includes(v)?s.filter(x=>x!=v):s.length<2?[...s,v]:s;r.s3=s;r.s3d=0}
else if(a=='ag'){let s=r.ag||[];r.agm=0;if(s.includes(v))s=s.filter(x=>x!=v);else if(s.length<3)s=[...s,v];else r.agm=1;r.ag=s}
else if(a=='copy'){const a2=r.ag||[],tx='Nuestro acuerdo de clase\n'+a2.map((j,q)=>(q+1)+'. '+AGR[j]).join('\n')+'\nEl respeto también se construye con lo que publicamos, compartimos y decidimos hacer.';try{await navigator.clipboard.writeText(tx);r.cp='ok'}catch(_){r.cp='x'}}
else if(a=='notes')notes=!notes;
else if(a=='fs'){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else wide=!wide}catch(_){wide=!wide}}
else if(a=='rst')M=1;else if(a=='rno')M=0;else if(a=='rok'){S={i:0,r:{}};M=0;return go(0)}
else if(a=='menu'){const t=document.getElementById('ml');t.innerHTML=t.innerHTML?'':`<div class="menu" style="top:3.2em;right:1em;position:fixed">${SECN.map((s,j)=>`<button data-a="go" data-v="${ST[j]}">${j+1}. ${s}</button>`).join('')}</div>`;return}
view();const c=document.getElementById('chat');if(c&&a=='inc')c.lastElementChild&&c.lastElementChild.scrollIntoView({block:'nearest'})});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight'&&!M)go(S.i+1);if(e.key=='ArrowLeft'&&!M)go(S.i-1)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.q!=null)S.r['q'+t.dataset.q]=t.value});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fb').textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa'});
view();
</script></body></html>
